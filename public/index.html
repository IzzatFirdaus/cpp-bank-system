<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Banking Dashboard</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface-hover: #222632;
  --border: #2a2e3a;
  --text: #e4e6eb;
  --text-muted: #8b8fa3;
  --accent: #6c5ce7;
  --accent-glow: rgba(108, 92, 231, 0.25);
  --green: #00b894;
  --green-bg: rgba(0, 184, 148, 0.12);
  --red: #e17055;
  --red-bg: rgba(225, 112, 85, 0.12);
  --blue: #74b9ff;
  --blue-bg: rgba(116, 185, 255, 0.12);
  --yellow: #fdcb6e;
  --yellow-bg: rgba(253, 203, 110, 0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --transition: 0.2s ease;
}

body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* ===== Layout ===== */
.app { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

header {
  text-align: center;
  margin-bottom: 40px;
}
header h1 {
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: -0.5px;
}
header h1 span { color: var(--accent); }
header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 4px; }

.dashboard {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 24px;
}

@media (max-width: 740px) {
  .dashboard { grid-template-columns: 1fr; }
}

/* ===== Cards ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow);
}

.card-title {
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  margin-bottom: 16px;
}

/* ===== Account Summary ===== */
.account-id {
  font-size: 0.95rem;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.balance-amount {
  font-size: 2.6rem;
  font-weight: 700;
  letter-spacing: -1px;
  margin-bottom: 4px;
}
.rate-badge {
  display: inline-block;
  background: var(--accent-glow);
  color: var(--accent);
  font-size: 0.85rem;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 20px;
  margin-top: 8px;
}

/* ===== Action Panel ===== */
.actions { display: flex; flex-direction: column; gap: 16px; }

.action-row {
  display: flex;
  gap: 10px;
  align-items: stretch;
}

.action-row input[type="number"] {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 1rem;
  padding: 10px 14px;
  outline: none;
  transition: border var(--transition);
  -moz-appearance: textfield;
}
.action-row input[type="number"]::-webkit-outer-spin-button,
.action-row input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
}
.action-row input[type="number"]:focus {
  border-color: var(--accent);
}

.btn {
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 600;
  padding: 10px 20px;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-deposit { background: var(--green); color: #fff; }
.btn-deposit:hover:not(:disabled) { background: #00a884; }

.btn-withdraw { background: var(--red); color: #fff; }
.btn-withdraw:hover:not(:disabled) { background: #d35c47; }

.btn-interest {
  width: 100%;
  background: var(--blue-bg);
  color: var(--blue);
  border: 1px solid rgba(116, 185, 255, 0.25);
}
.btn-interest:hover:not(:disabled) { background: rgba(116, 185, 255, 0.2); }

/* ===== Audit Log ===== */
.log-section { grid-column: 1 / -1; }

.log-list {
  max-height: 320px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.log-list::-webkit-scrollbar { width: 6px; }
.log-list::-webkit-scrollbar-track { background: transparent; }
.log-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.log-entry {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 0.88rem;
  animation: fadeIn 0.25s ease;
}
.log-entry:last-child { border-bottom: none; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

.log-badge {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 12px;
  min-width: 90px;
  text-align: center;
  flex-shrink: 0;
}
.badge-deposit  { background: var(--green-bg);  color: var(--green); }
.badge-withdraw { background: var(--red-bg);    color: var(--red); }
.badge-interest { background: var(--yellow-bg); color: var(--yellow); }

.log-time { color: var(--text-muted); font-size: 0.8rem; flex-shrink: 0; }
.log-amount { font-weight: 600; margin-left: auto; flex-shrink: 0; }

.log-empty {
  text-align: center;
  color: var(--text-muted);
  padding: 40px;
  font-size: 0.9rem;
}

/* ===== Toast Notifications ===== */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.toast {
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-weight: 500;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  animation: slideIn 0.3s ease;
  max-width: 360px;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
.toast-success { background: var(--green); color: #fff; }
.toast-error   { background: var(--red);   color: #fff; }
.toast-info    { background: var(--accent); color: #fff; }

/* ===== Status Indicator ===== */
.status-bar {
  text-align: center;
  margin-bottom: 24px;
  font-size: 0.82rem;
  color: var(--text-muted);
}
.status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}
.status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
.status-dot.disconnected { background: var(--red); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span>&#9670;</span> Smart Banking Dashboard</h1>
    <p>Real-time account management &amp; transaction monitoring</p>
  </header>

  <div class="status-bar">
    <span class="status-dot disconnected" id="statusDot"></span>
    <span id="statusText">Connecting to server...</span>
  </div>

  <div class="dashboard">
    <!-- Account Summary -->
    <div class="card">
      <div class="card-title">Account Summary</div>
      <div class="account-id" id="accountId">---</div>
      <div class="balance-amount" id="balance">$0.00</div>
      <div class="rate-badge" id="rateBadge">0.00% APY</div>
    </div>

    <!-- Action Panel -->
    <div class="card">
      <div class="card-title">Transactions</div>
      <div class="actions">
        <div class="action-row">
          <input type="number" id="amountInput" placeholder="Amount" min="0.01" step="0.01">
          <button class="btn btn-deposit" id="btnDeposit">Deposit</button>
        </div>
        <div class="action-row">
          <input type="number" id="withdrawInput" placeholder="Amount" min="0.01" step="0.01">
          <button class="btn btn-withdraw" id="btnWithdraw">Withdraw</button>
        </div>
        <button class="btn btn-interest" id="btnInterest">&#9733; Apply Interest</button>
      </div>
    </div>

    <!-- Audit Log -->
    <div class="card log-section">
      <div class="card-title">Audit Log <span id="logCount" style="font-weight:400;text-transform:none;letter-spacing:0"></span></div>
      <div class="log-list" id="logList">
        <div class="log-empty">No transactions recorded yet.</div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
(() => {
  'use strict';

  const API = window.location.origin;

  // --- DOM refs ---
  const $ = id => document.getElementById(id);
  const statusDot   = $('statusDot');
  const statusText  = $('statusText');
  const accountId   = $('accountId');
  const balanceEl   = $('balance');
  const rateBadge   = $('rateBadge');
  const amountInput = $('amountInput');
  const withdrawInput = $('withdrawInput');
  const btnDeposit  = $('btnDeposit');
  const btnWithdraw = $('btnWithdraw');
  const btnInterest = $('btnInterest');
  const logList     = $('logList');
  const logCount    = $('logCount');
  const toastBox    = $('toastContainer');

  // --- Toast ---
  function toast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    toastBox.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, 2800);
    setTimeout(() => el.remove(), 3200);
  }

  // --- Fetch helpers ---
  async function api(method, path, body) {
    const opts = { method, headers: {} };
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(`${API}${path}`, opts);
    const data = await res.json();
    if (!res.ok) throw { status: res.status, data };
    return data;
  }

  // --- Refresh account summary ---
  async function refreshAccount() {
    try {
      const d = await api('GET', '/api/account');
      accountId.textContent = d.accountNumber;
      balanceEl.textContent = `$${Number(d.balance).toFixed(2)}`;
      rateBadge.textContent = `${Number(d.interestRate).toFixed(2)}% APY`;
      statusDot.className = 'status-dot connected';
      statusText.textContent = 'Connected to server';
    } catch (e) {
      statusDot.className = 'status-dot disconnected';
      statusText.textContent = 'Server unreachable';
    }
  }

  // --- Refresh logs ---
  let lastLogLines = [];

  async function refreshLogs() {
    try {
      const lines = await api('GET', '/api/logs');
      if (!lines.length) {
        logList.innerHTML = '<div class="log-empty">No transactions recorded yet.</div>';
        logCount.textContent = '';
        lastLogLines = [];
        return;
      }
      logCount.textContent = `(${lines.length})`;

      // Fast path: content unchanged — do not touch the DOM (avoids re-animation flicker)
      if (lines.length === lastLogLines.length &&
          lines.every((l, i) => l === lastLogLines[i])) {
        return;
      }

      // Newest-first: count how many entries were prepended since last poll
      let newCount = 0;
      while (newCount < lines.length && newCount < lastLogLines.length &&
             lines[newCount] !== lastLogLines[newCount]) {
        newCount++;
      }
      const tailMatches = newCount < lines.length &&
        lines.slice(newCount).every((l, i) => l === lastLogLines[i]);

      if (tailMatches && newCount > 0) {
        // Prepend only the new entries; existing rows keep their DOM nodes and scroll
        logList.insertAdjacentHTML('afterbegin', lines.slice(0, newCount).map(parseLogLine).join(''));
        lastLogLines = lines;
        return;
      }

      // Fallback (log reset / reordered): full re-render
      logList.innerHTML = lines.map(parseLogLine).join('');
      lastLogLines = lines;
    } catch {
      logList.innerHTML = '<div class="log-empty">Could not load logs.</div>';
      lastLogLines = [];
    }
  }

  function parseLogLine(line) {
    // Format: <ISO-8601> Account: <id> | Action: <TYPE> | Amount: $<value>
    const timeMatch = line.match(/^(\d{4}-\d{2}-\d{2}T[\d:]+)/);
    const actionMatch = line.match(/Action:\s*(\w+)/);
    const amountMatch = line.match(/Amount:\s*\$([\d.]+)/);

    const time = timeMatch ? formatTime(timeMatch[1]) : '';
    const action = actionMatch ? actionMatch[1] : 'UNKNOWN';
    const amount = amountMatch ? amountMatch[1] : '0.00';

    let badgeClass = 'badge-interest';
    if (action === 'DEPOSIT') badgeClass = 'badge-deposit';
    else if (action === 'WITHDRAW') badgeClass = 'badge-withdraw';

    return `<div class="log-entry">
      <span class="log-time">${time}</span>
      <span class="log-badge ${badgeClass}">${action.replace('_', ' ')}</span>
      <span class="log-amount">$${Number(amount).toFixed(2)}</span>
    </div>`;
  }

  function formatTime(iso) {
    try {
      const d = new Date(iso.replace('T', 'T'));
      if (isNaN(d)) return iso;
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch { return iso; }
  }

  // --- Actions ---
  async function doDeposit() {
    const val = parseFloat(amountInput.value);
    if (!val || val <= 0 || !isFinite(val)) { toast('Enter a valid positive amount', 'error'); return; }
    btnDeposit.disabled = true;
    try {
      const d = await api('POST', '/api/deposit', { amount: val });
      toast(`Deposited $${val.toFixed(2)}`, 'success');
      amountInput.value = '';
      balanceEl.textContent = `$${Number(d.balance).toFixed(2)}`;
      refreshLogs();
    } catch (e) {
      toast(e.data?.error || 'Deposit failed', 'error');
    } finally { btnDeposit.disabled = false; }
  }

  async function doWithdraw() {
    const val = parseFloat(withdrawInput.value);
    if (!val || val <= 0 || !isFinite(val)) { toast('Enter a valid positive amount', 'error'); return; }
    btnWithdraw.disabled = true;
    try {
      const d = await api('POST', '/api/withdraw', { amount: val });
      toast(`Withdrew $${val.toFixed(2)}`, 'success');
      withdrawInput.value = '';
      balanceEl.textContent = `$${Number(d.balance).toFixed(2)}`;
      refreshLogs();
    } catch (e) {
      toast(e.data?.error || 'Withdrawal failed', 'error');
      if (e.data?.balance !== undefined) {
        balanceEl.textContent = `$${Number(e.data.balance).toFixed(2)}`;
      }
    } finally { btnWithdraw.disabled = false; }
  }

  async function doInterest() {
    btnInterest.disabled = true;
    try {
      const d = await api('POST', '/api/apply-interest');
      const credited = Number(d.credited);
      toast(`Interest applied: +$${credited.toFixed(2)}`, 'success');
      balanceEl.textContent = `$${Number(d.balance).toFixed(2)}`;
      refreshLogs();
    } catch (e) {
      toast(e.data?.error || 'Interest application failed', 'error');
    } finally { btnInterest.disabled = false; }
  }

  // --- Event listeners ---
  btnDeposit.addEventListener('click', doDeposit);
  btnWithdraw.addEventListener('click', doWithdraw);
  btnInterest.addEventListener('click', doInterest);

  amountInput.addEventListener('keydown', e => { if (e.key === 'Enter') doDeposit(); });
  withdrawInput.addEventListener('keydown', e => { if (e.key === 'Enter') doWithdraw(); });

  // --- Init ---
  refreshAccount();
  refreshLogs();

  // Auto-refresh logs every 5 seconds (non-blocking)
  setInterval(refreshLogs, 5000);
})();
</script>
</body>
</html>
